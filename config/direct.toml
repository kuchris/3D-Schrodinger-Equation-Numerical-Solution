# Solve the whole Hamiltonian first. No orbital labels or reflection sectors.
[simulation]
method = "full"
potential = "hydrogen"
n = 64
length = 40.0
states = 14

[plot]
# An energy-sorted index, NOT a principal/angular quantum number.
state = 9
hydrogen_orbital = ""
quantity = "wavefunction"
zoom = "auto"
density_scale = "log"
surface = true
output = ""

[analysis]
# Measurements are made after eigsh returns; they do not modify eigenvectors.
angular_momentum = true
# "raw" keeps the eigensolver's vectors. "symmetry" recombines vectors only
# inside each degenerate level, using reflections and the x<->y swap that
# leave V unchanged. No orbital labels or templates are used.
basis = "symmetry"
