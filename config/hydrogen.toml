# Numerical hydrogen orbitals, using the same finite-difference Hamiltonian.
# This mode uses known symmetries. For unconstrained solving use config/direct.toml.
# Run hydrogen.cmd in the project root. Edit hydrogen_orbital to choose the shape.
[simulation]
method = "symmetry"
potential = "hydrogen"
n = 100
length = 50.0
states = 10

[plot]
# Named orbital mode selects a symmetry sector, so the generic state is ignored.
state = 0
hydrogen_orbital = "3d_z2"
quantity = "wavefunction"
zoom = "auto"
density_scale = "log"
surface = true
output = ""
