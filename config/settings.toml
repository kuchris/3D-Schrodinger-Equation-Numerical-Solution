# Edit and save this file, then double-click plot.cmd in the project root.

[simulation]
# "full" solves the whole Cartesian grid without orbital constraints.
method = "full"
# "custom" = your function in custom/potential.py
# Paper presets: "box", "paper_harmonic", "circular", "torus", "tanh", "hydrogen"
# "harmonic" is the separate omega=1 analytical benchmark.
potential = "custom"

# Interior grid points per axis. An odd number includes the exact center.
# For "hydrogen", odd n is increased by one to avoid the singular origin.
n = 25

# Cube side length. Each axis runs from -length/2 to +length/2.
length = 8.0

# Minimum number of lowest states to compute. The selected state is included.
states = 10

[plot]
# 0 = ground state; 1 = first excited state. Indices count degenerate states.
state = 4

# "wavefunction" = signed amplitude (red/blue); "density" = probability density
quantity = "wavefunction"

# "auto" frames at least 99.5% of the sampled probability; "full" shows the box.
zoom = "auto"
# For density only: "log" makes weaker outer lobes visible.
density_scale = "linear"
# Also save a 3D signed-amplitude isosurface image.
surface = false
# Only for method="symmetry". Leave empty in full mode.
hydrogen_orbital = ""

# Leave empty to save an automatically named image in outputs/plots.
# Paths are relative to the project root, e.g. "outputs/plots/my_state.png".
output = ""
